<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="version" content="3.0.0" />
    <!-- Mobile Fullscreen & Web App Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Windows 11" />
    <meta name="full-screen" content="yes" />
    <meta name="browsermode" content="application" />
    <meta name="screen-orientation" content="landscape" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="x5-page-mode" content="app" />
    <meta
      name="description"
      content="Experience the look and feel of Windows 11 directly in your browser with this web-based clone. Enjoy a similar user interface and functionality."
    />
    
    <meta name="keywords" content="Windows 11, web desktop, desktop UI, browser OS, Windows clone, web app" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%PUBLIC_URL%/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Windows 11 — Web Desktop" />
    <meta property="og:description" content="Experience the look and feel of Windows 11 directly in your browser with this web-based clone." />
    <meta property="og:url" content="%PUBLIC_URL%/" />
    <meta property="og:image" content="%PUBLIC_URL%/logo192.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Windows 11 — Web Desktop" />
    <meta name="twitter:description" content="Experience the look and feel of Windows 11 directly in your browser with this web-based clone." />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo192.png" />

    <!-- Structured data: WebSite -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","url":"%PUBLIC_URL%/","name":"Windows 11","description":"A browser-based Windows 11-like desktop experience.","potentialAction":{"@type":"SearchAction","target":"%PUBLIC_URL%/?s={search_term_string}","query-input":"required name=search_term_string"}}
    </script>
    
    <!-- Preconnect to external domains for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images8.alphacoders.com" />
    <link rel="preconnect" href="https://em-content.zobj.net" />
    <link rel="preconnect" href="https://laaouatni.github.io" />
    <link rel="preconnect" href="https://www.freepnglogos.com" />
    
    <!-- Preload critical local and remote images -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/images/wallpapers/windows11.jpg" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/images/apps/chrome.png" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/images/apps/folder.png" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/images/apps/recyclebin.png" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/images/apps/calculator.png" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/images/apps/windows.png" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/images/apps/explorer.png" />
    
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    />
